[project]
name = "ha-svitlobot-validator"
version = "0.1.5"
description = "Home Assistant integration: check Svitlobot outage posts against local grid sensors"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.357",  # = Home Assistant 2026.8.3
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
